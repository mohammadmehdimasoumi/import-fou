<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Fou: developer-controlled codebase inspection for Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a33"/>
      <stop offset="1" stop-color="#1b2a52"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <text x="70" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="700" fill="#ffffff">Fou</text>
  <rect x="72" y="160" width="120" height="6" rx="3" fill="#e0533d"/>
  <text x="70" y="215" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#dfe6f7">Developer-controlled codebase</text>
  <text x="70" y="252" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#dfe6f7">inspection and navigation for Python</text>

  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21">
    <rect x="70" y="295" width="330" height="56" rx="10" fill="#0a1226" stroke="#3a4a7a"/>
    <text x="92" y="331" fill="#7ee0a0">$ pip install fou</text>
    <rect x="420" y="295" width="370" height="56" rx="10" fill="#0a1226" stroke="#3a4a7a"/>
    <text x="442" y="331" fill="#f6d36b">from fou import inspect</text>
  </g>

  <!-- terminal card -->
  <g transform="translate(780,48)">
    <rect width="370" height="324" rx="16" fill="#0a1226" stroke="#3a4a7a"/>
    <circle cx="26" cy="26" r="7" fill="#e0533d"/>
    <circle cx="48" cy="26" r="7" fill="#f6d36b"/>
    <circle cx="70" cy="26" r="7" fill="#7ee0a0"/>
    <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" fill="#dfe6f7">
      <text x="24" y="76"  fill="#7ee0a0">$ fou inspect ./shop -t classes</text>
      <text x="24" y="112">Project: shop</text>
      <text x="24" y="140">Classes (2)</text>
      <text x="24" y="176" fill="#9fb3e8">core/models.py</text>
      <text x="24" y="204">├── Product  (line 9)</text>
      <text x="24" y="232" fill="#f6d36b" text-decoration="underline">└── Cart  (line 20)</text>
      <text x="24" y="282" fill="#e0533d" font-size="17">⮑ click → opens your editor at line 20</text>
    </g>
  </g>
</svg>
